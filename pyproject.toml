[build-system]
requires = ["uv_build >=0.12.10, <0.13.0"]
build-backend = "uv_build"

[project]
name = "comfyui-one"
version = "0.0.1"
dependencies = [
	"jsrun >=0.1.0",
	"torch >=2.12.0"
]
requires-python = ">=3.10, <3.15"
authors = [{name = "Ian Sun", email = "me@sunyun.name"}]
license = "MIT"

[project.urls]
Repository = "https://github.com/IanSun/ComfyUI-One.git"

[project.scripts]
comfyui-one = "comfyui_one_cli:main"

[tool.uv.build-backend]
module-name = [
	"comfyui_one",
	"comfyui_one_cli"
]
module-root = "packages/one"
source-exclude = [
	"comfyui_one/ui/node_modules",
	"comfyui_one/ui/src",
	"comfyui_one/ui/package.json",
	"comfyui_one/ui/project.json",
	"comfyui_one/ui/tsconfig.json",
	"comfyui_one/ui/tsconfig.node.json",
	"comfyui_one/ui/tsconfig.ui.json",
	"comfyui_one/ui/vite.config.ts"
]
